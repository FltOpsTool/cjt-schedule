<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CJT Schedule">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v3.png">
<script>
/* set the theme before first paint so there is no flash */
(function(){try{var p=localStorage.getItem('cjt.theme');var d=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
var t=p==='day'?'day':p==='night'?'night':(d?'night':'day');document.documentElement.setAttribute('data-theme',t);
if(t==='day'){document.querySelector('meta[name=theme-color]').setAttribute('content','#f3f5f9');document.querySelector('meta[name=color-scheme]').setAttribute('content','light');}}catch(e){}})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v3.png">
<title>CJT Schedule</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b1220; --surface:#141d30; --surface2:#1b2740; --line:#2a3858; --line2:#1f2b46;
  --text:#e9eef7; --muted:#93a1bb; --accent:#4fc3dc; --accent-ink:#06222a;
  --flight:#ffd400; --flight-ink:#14110a; --dead:#ff4fd8; --dead-ink:#14110a; --event:#b266ff; --event-ink:#12091c;
  --office:#d98a1b; --office-ink:#1b1200;
  --warn:#ff8a65; --ok:#58d68d;
  --inset:#0f1729; --head:#101a2c; --dim:#10182a;
  --ext:#26324a; --dutybar:#516080;
  --tag-bg:#243556; --tag-ink:#c8d6f0;
  --next-a:#17304a; --next-b:#142238; --next-line:#2c4a6e;
  --rest-bg:#151a36; --rest-line:#3b3f7a; --rest-ink:#b6baff; --moon:#9db4e8;
  --banner-bg:#3a2216; --banner-line:#7a3d1d; --banner-ink:#ffd2bd;
  --notice-bg:#2a2a12; --notice-line:#6a6a22; --notice-ink:#f3efb0;
  --danger-bg:#3b1a1a; --danger-line:#7a2f2f; --danger-ink:#ffb4b4;
  --pill-bg:#12331f; --pill-line:#1f5a38; --pill-ink:#58d68d;
  --today-bg:#183150; --toast-bg:#e9eef7; --toast-ink:#0b1220;
  --backdrop:rgba(4,8,16,.7);
  --good:#9be8bd; --bad:#ffb4b4;
}
:root[data-theme="day"]{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eaeef6; --line:#cdd6e6; --line2:#dde4f0;
  --text:#101828; --muted:#566178; --accent:#0a6f8a; --accent-ink:#ffffff;
  --flight:#c27d00; --flight-ink:#120b00; --dead:#c4188f; --dead-ink:#ffffff; --event:#7b1fe0; --event-ink:#ffffff;
  --office:#f0a53a; --office-ink:#2a1700;
  --warn:#b4400f; --ok:#15703f;
  --inset:#f4f6fb; --head:#e6ebf4; --dim:#edf0f6;
  --ext:#c3cde0; --dutybar:#7a88a8;
  --tag-bg:#dde5f4; --tag-ink:#243556;
  --next-a:#e0eff6; --next-b:#d6e6f2; --next-line:#a8c8dc;
  --rest-bg:#eceefd; --rest-line:#c3c7ee; --rest-ink:#3d42a8; --moon:#4b5f92;
  --banner-bg:#fff1e6; --banner-line:#eeb98c; --banner-ink:#7a3d1d;
  --notice-bg:#fff8d4; --notice-line:#e2d369; --notice-ink:#5a5210;
  --danger-bg:#fdecec; --danger-line:#e3a0a0; --danger-ink:#a12a2a;
  --pill-bg:#dff5e8; --pill-line:#9bd7b4; --pill-ink:#15703f;
  --today-bg:#dcedf5; --toast-bg:#101828; --toast-ink:#f3f5f9;
  --backdrop:rgba(16,24,40,.45);
  --good:#15703f; --bad:#a12a2a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
html.noscroll,html.noscroll body{overflow:hidden}
body{margin:0;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.app{max-width:560px;margin:0 auto;padding:0 12px 48px}
.top{display:flex;align-items:center;gap:8px;padding:10px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:19px;margin:0;flex:1;min-width:0;white-space:nowrap;letter-spacing:.01em}
.top h1 small{display:block;font-size:11px;font-weight:800;line-height:1.1;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
@media (max-width:399px){.pill.off{font-size:10px;padding:3px 7px}}
@media (max-width:349px){.pill.off{display:none}}
.top .tl{flex:1;min-width:0;display:flex;align-items:center}
.top .tr{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px}
@media (max-width:519px){.top .pill.off{display:inline-block;font-size:0;width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#3fb950}}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn.spin svg{animation:spin .8s linear infinite}
#splash{position:fixed;left:0;top:0;width:100%;height:100%;z-index:1000;background:#000;pointer-events:none;overflow:hidden}
#splash img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.72);transform-origin:50% 50%;will-change:transform,opacity}
#splash.go img{animation:splashZoom 1.7s cubic-bezier(.22,.61,.36,1) forwards}
#splash.go{animation:splashOut .4s ease 1.9s forwards}
@keyframes splashZoom{0%{transform:scale(.72);opacity:0}22%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes splashOut{to{opacity:0}}
@media (prefers-reduced-motion:reduce){#splash{display:none}}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.iconbtn svg{display:block}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--pill-bg);color:var(--pill-ink);border:1px solid var(--pill-line);white-space:nowrap}
.banner{background:var(--banner-bg);border:1px solid var(--banner-line);color:var(--banner-ink);border-radius:12px;padding:10px 12px;margin:4px 0 10px;font-size:14px}
.next{display:block;width:100%;background:linear-gradient(135deg,var(--next-a),var(--next-b));border:2px solid var(--accent);border-radius:16px;padding:14px 16px;margin:2px 0 14px}
.next-k{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.next-t{font-size:18px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.next-r{font-size:14px;color:var(--muted);margin-top:3px}
@media (min-width:600px){.next-t{font-size:24px}.next-r{font-size:16px}}
.monthbar{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.monthbar h2{flex:1;margin:0;font-size:20px;text-align:center}
.todaybtn{font-size:13px;font-weight:700;padding:0 12px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line2)}
.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.week{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0}
.grid{border-top-left-radius:0;border-top-right-radius:0;touch-action:pan-y pinch-zoom}
.week div{background:var(--head);font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:5px 0}
.cell{position:relative;min-height:68px;background:var(--surface);padding:4px 3px 4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.dim{background:var(--dim)}
.cell.dim .dn{opacity:.55}
.cell.today{background:var(--today-bg)}
.cell.nextd{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.sel,.cell.sel.nextd{box-shadow:inset 0 0 0 3px var(--text)}
.nextmark{position:absolute;top:3px;right:2px;font-size:7.5px;font-weight:900;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);padding:1px 3px;border-radius:4px}
@media (min-width:600px){.nextmark{font-size:10px;top:5px;right:5px;padding:2px 5px}}
.row.isnext{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row.isnext.sel{box-shadow:0 0 0 3px var(--text)}
.tag.nowtag{background:var(--accent);color:var(--accent-ink)}
.dn{font-size:12px;font-weight:700;color:var(--muted);align-self:flex-start;line-height:1.3}
.cell.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px}
.bar{position:relative;height:16px;overflow:hidden}
.bar i{position:absolute;display:block;min-width:2px}
.bar .ext{background:var(--ext);top:3px;bottom:3px}
.bar .duty{background:var(--dutybar);top:1px;bottom:1px}
.bar .leg{top:0;bottom:0}
.bar .leg.flight{background:var(--flight)}
.bar .leg.deadhead,.bar .leg.ground{background:var(--dead)}
.bar .leg.event{background:var(--event)}
.lbl{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chip-day{background:var(--office);color:var(--office-ink);font-size:9px;font-weight:800;letter-spacing:.02em;border-radius:4px;padding:4px 0;text-align:center;margin-top:1px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.chip-day.other{background:#5b6b8c;color:#fff}
.ci{display:flex;gap:2px;justify-content:flex-end;align-items:flex-end;margin-top:auto;min-height:21px;pointer-events:none}
.ic{display:inline-flex;width:21px;height:21px;flex:none}
.ic img{width:100%;height:100%;display:block;border-radius:22%;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.ic-sim{width:23px;height:23px}
@media (max-width:599px){.chip-day.office{display:none}.cell{min-height:78px}.ci .ic:nth-child(3){display:none}.cell.oo .ci{position:absolute;left:0;right:0;top:22px;bottom:2px;margin:0;justify-content:center;align-items:center}.cell.oo .ic{width:40px;height:40px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:10px 2px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
.sect{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:16px 2px 8px;text-transform:uppercase}
.row{display:grid;grid-template-columns:6px 1fr 18px;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px;padding:0 10px 0 0}
.row.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row .stripe{align-self:stretch;background:var(--c)}
.row .rb{padding:10px 0}
.row .rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:16px}
.row .rs{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;margin-top:2px}
.row .rm{font-size:12px;color:var(--muted);margin-top:2px}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--tag-bg);color:var(--tag-ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-ink)}
.btn[disabled]{opacity:.5}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;animation:slide .16s ease-out;overscroll-behavior:contain}
@keyframes slide{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.panel{min-height:100%;background:var(--bg)}
.sheet-head{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
.sheet-title{flex:1;font-weight:800;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{max-width:560px;margin:0 auto;padding:12px 12px calc(80px + env(safe-area-inset-bottom))}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:2px;flex:none}
.seg button{padding:9px 11px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pid{font-size:28px;font-weight:900;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--surface2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.range{font-size:15px;font-variant-numeric:tabular-nums;margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:12px}
.notice{background:var(--notice-bg);border:1px solid var(--notice-line);color:var(--notice-ink);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:14px;margin:0 6px 6px 0}
.person.me{border-color:var(--accent)}
.person .you{font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase}
.role{font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;background:#1d6fa8;color:#fff;min-width:28px;text-align:center}
.r-SI{background:#a83f62}.r-CP{background:#1f7a5c}.r-FO{background:#1d6fa8}.r-CA{background:#1d6fa8}
.crewrow .sub{font-size:12px;color:var(--muted)}
.duty{scroll-margin-top:76px}
.dh{display:flex;align-items:baseline;gap:8px}
.dh h3{margin:0;font-size:13px;letter-spacing:.1em;font-weight:900;color:var(--accent)}
.dh span{font-size:13px;color:var(--muted)}
.tbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tb{background:var(--surface2);border-radius:10px;padding:8px 10px}
.tb-l{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.t-big{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.t-big .ab{font-size:13px;font-weight:700;color:var(--muted)}
.t-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip.trk{min-height:40px;padding:0 14px;text-decoration:none;border-color:var(--accent);color:var(--accent);font-weight:700}
.chip{display:inline-flex;align-items:center;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--inset);border:1px solid var(--line);min-height:28px}
button.chip{min-height:40px;padding:0 14px}
.leg-card{display:grid;grid-template-columns:7px 1fr;border-radius:12px;overflow:hidden;background:var(--surface2);margin:10px 0 0}
.leg-card .stripe{background:var(--c)}
.lm{padding:10px 12px}
.lt{display:flex;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:900;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--c);color:var(--ink)}
.k-flight{--c:var(--flight);--ink:var(--flight-ink)}
.k-dead{--c:var(--dead);--ink:var(--dead-ink)}
.k-event{--c:var(--event);--ink:var(--event-ink)}
.flt{font-weight:800;font-size:16px}
.blk{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.route{font-size:22px;font-weight:900;letter-spacing:.03em;margin:4px 0 6px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gap{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 0}
.rest{border-color:var(--rest-line);background:var(--rest-bg)}
.rest .rh{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;letter-spacing:.1em;color:var(--rest-ink)}
.rest .rd{font-size:22px;font-weight:900;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.rest .hn{font-weight:700}
.call{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px;padding:0 12px;border-radius:12px;background:var(--inset);border:1px solid var(--line);text-decoration:none}
.call small{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.call .num{font-weight:800;font-variant-numeric:tabular-nums}
.warn{color:var(--warn);font-size:12px;margin-top:4px}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.shots button{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--line)}
.shots img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.sheet.viewer{background:#000;z-index:40}
.viewer .bar2{position:sticky;top:0;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:rgba(0,0,0,.7);z-index:2}
.viewer .btn{background:#222;border-color:#444;color:#fff}
.viewer .btn.danger{background:#3b1a1a;border-color:#7a2f2f;color:#ffb4b4}
.viewer img{display:block;width:100%;height:auto}
.viewer img.zoom{width:240%;max-width:none}
.field{display:block;margin:10px 0}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
textarea{width:100%;min-height:90px;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px/1.4 ui-monospace,Menlo,Consolas,monospace}
.result{font-size:14px;margin-top:10px;white-space:pre-wrap}
.result.bad{color:var(--bad)}
.result.good{color:var(--good)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:14px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:99;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.4)}
input[type=file]{display:none}
.txt{width:100%;min-height:44px;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:0 10px;font:16px ui-monospace,Menlo,Consolas,monospace}
label.check{display:flex;align-items:center;gap:10px;min-height:44px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--accent)}
.pane-empty{padding:56px 24px;text-align:center;color:var(--muted)}

/* iPad portrait and small tablets */
@media (min-width:600px){
  .app{max-width:760px;padding:0 20px 56px}
  .top h1{font-size:22px}
  .monthbar h2{font-size:24px}
  .cell{min-height:124px;padding:6px 6px}
  .dn{font-size:14px}
  .bar{height:22px}
  .lbl{font-size:12px}
  .chip-day{font-size:11px;padding:6px 0}
  .ic{width:42px;height:42px}
  .ic-sim{width:48px;height:48px}
  .ci{gap:6px;min-height:48px}
  .week div{font-size:12px;padding:7px 0}
  .legend{font-size:13px}
  .sheet{background:var(--backdrop)}
  .sheet.viewer{background:#000}
  .panel{max-width:720px;margin:0 auto;box-shadow:0 0 0 1px var(--line),0 12px 48px rgba(0,0,0,.35)}
  .sheet-body{padding:16px 20px 90px;max-width:none}
  .pid{font-size:32px}
  .t-big{font-size:24px}

        h('div', { class: 'sect', style: 'margin-top:0', text: 'Backup' }),
        h('label', { class: 'check' }, withShots, 'Include screenshots (larger file)'),
        h('button', { type: 'button', class: 'btn', onclick: async () => { try { await exportBackup(withShots.checked); toast('Backup saved to Downloads'); } catch (e) { toast('Backup failed: ' + e.message); } }, text: 'Export backup file' })),
      h('div', { class: 'card' },
        h('div', { class: 'sect', style: 'margin-top:0', text: 'Storage and offline' }),
        kv('Offline use', offline ? 'Ready' : 'Not active yet'),
        kv('Stored on this device', `${S.pairings.length} pairings, ${S.days.length} days, ${S.shots.length} screenshots`),
        est && est.usage != null ? kv('Space used', mb(est.usage)) : null,
        kv('Protected from clean-up', S.persisted == null ? 'Unknown' : S.persisted ? 'Yes' : 'Not guaranteed. Installing to the home screen usually fixes this.'),
        !offline ? h('div', { class: 'small muted', style: 'margin-top:8px', text: 'Open the app once with a connection, then reload it. After that it works without data.' }) : null,
        S.installEvt ? h('div', { style: 'margin-top:10px' }, h('button', { type: 'button', class: 'btn', onclick: async () => { S.installEvt.prompt(); await S.installEvt.userChoice; S.installEvt = null; closeSheet(); }, text: 'Install app' })) : null),
      h('div', { class: 'card' },
        h('div', { class: 'sect', style: 'margin-top:0', text: 'About' }),
        kv('Version', APP_VERSION),
        h('div', { class: 'small muted', style: 'margin-top:8px', text: 'All schedule data stays on this device. Nothing is uploaded. The hosted page contains no schedule data.' })),
      h('div', { class: 'full-only', style: 'text-align:center' },
        h('button', { type: 'button', class: 'btn danger', onclick: async () => {
          if (!confirm('Delete ALL pairings, days and screenshots from this device? This cannot be undone.')) return;
          await dbClear('pairings'); await dbClear('days'); await dbClear('shots');
          S.pairings = []; S.days = []; S.shots = [];
          S.sync.shas = {}; await dbPut('meta', { k: 'sync', v: S.sync });
          closeSheet(); render(); toast('All data deleted');
        } }, icon('trash', 18), 'Delete all data'))));
  if (FAM()) sheet.querySelectorAll('.full-only').forEach(e => e.remove());
}

/* ---------- boot ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; });
window.addEventListener('appinstalled', () => { S.installEvt = null; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!sheets.length) render(); autoSync(false); } });
setInterval(() => {
  document.querySelectorAll('.cd[data-st]').forEach(el => { const st = +el.dataset.st; if (st) el.textContent = countdown(st - Date.now()); });
}, 30000);

async function init() {
  try { const m = localStorage.getItem('cjt.mode'); if (['local', 'base', 'utc'].includes(m)) S.mode = m; } catch { /* ignore */ }
  try { const v = localStorage.getItem('cjt.view'); if (v === 'family') S.view = 'family'; } catch { /* ignore */ }
  try { const q = new URLSearchParams(location.search).get('view'); if (q === 'family' || q === 'full') setView(q); } catch { /* ignore */ }
  try { const t = localStorage.getItem('cjt.theme'); if (['auto', 'day', 'night'].includes(t)) S.theme = t; } catch { /* ignore */ }
  applyTheme();
  const onChange = f => (darkMQ.addEventListener ? darkMQ.addEventListener('change', f) : null);
  onChange(() => { if (S.theme === 'auto') applyTheme(); });
  if (wideMQ.addEventListener) wideMQ.addEventListener('change', () => {
    if (!wideMQ.matches) { runPaneClose(); S.sel = null; S.selDay = null; paneEl.replaceChildren(); }
    S.autoDone = false;
    render();
  });
  try { S.db = await openDB(); await loadAll(); } catch (e) { S.db = null; S.dbError = e; }
  const k = keyOf(Date.now(), S.baseTz);
  S.month = { y: +k.slice(0, 4), m: +k.slice(5, 7) - 1 };
  render();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!sheets.length) render(); });
    navigator.serviceWorker.register('./sw.js').catch(() => { /* offline caching unavailable */ });
  }
  try { const m = sessionStorage.getItem('cjt.msg'); if (m) { sessionStorage.removeItem('cjt.msg'); toast(m); } } catch { /* ignore */ }
  requestPersist();
  autoSync(true);
}
init();
})();
</script>
</body>
</html>
