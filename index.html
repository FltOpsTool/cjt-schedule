/* set the theme before first paint so there is no flash */
(function(){try{var p=localStorage.getItem('cjt.theme');var d=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;

</script>

<title>Ashley Aloft</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b1220; --surface:#141d30; --surface2:#1b2740; --line:#2a3858; --line2:#1f2b46;

  --office:#d98a1b; --office-ink:#1b1200; --office-soft:rgba(217,138,27,.20); --office-soft-ink:#e4b05a;
  --warn:#ff8a65; --ok:#58d68d;
  --now:#ff7a1a; --now-ink:#1a0d00; --now-soft:rgba(255,122,26,.22);
  --inset:#0f1729; --head:#101a2c; --dim:#10182a;

  --banner-bg:#3a2216; --banner-line:#7a3d1d; --banner-ink:#ffd2bd;
  --notice-bg:#2a2a12; --notice-line:#6a6a22; --notice-ink:#f3efb0;
  --danger-bg:#3b1a1a; --danger-line:#7a2f2f; --danger-ink:#ffb4b4;
  --pill-bg:#12331f; --pill-line:#1f5a38; --pill-ink:#58d68d;
  --today-bg:rgba(255,122,26,.23); --today-hi:rgba(255,122,26,.42); --toast-bg:#e9eef7; --toast-ink:#0b1220;
  --backdrop:rgba(4,8,16,.7);
  --good:#9be8bd; --bad:#ffb4b4;
}
:root[data-theme="day"]{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eaeef6; --line:#cdd6e6; --line2:#dde4f0;
  --text:#101828; --muted:#566178; --accent:#0a6f8a; --accent-ink:#ffffff;
  --flight:#c27d00; --flight-ink:#120b00; --dead:#c4188f; --dead-ink:#ffffff; --event:#7b1fe0; --event-ink:#ffffff;
  --office:#f0a53a; --office-ink:#2a1700; --office-soft:rgba(224,150,40,.22); --office-soft-ink:#8a5712;
  --warn:#b4400f; --ok:#15703f;

  --tag-bg:#dde5f4; --tag-ink:#243556;
  --next-a:#e0eff6; --next-b:#d6e6f2; --next-line:#a8c8dc;
  --rest-bg:#eceefd; --rest-line:#c3c7ee; --rest-ink:#3d42a8; --moon:#4b5f92;
  --banner-bg:#fff1e6; --banner-line:#eeb98c; --banner-ink:#7a3d1d;
  --notice-bg:#fff8d4; --notice-line:#e2d369; --notice-ink:#5a5210;
  --danger-bg:#fdecec; --danger-line:#e3a0a0; --danger-ink:#a12a2a;
  --pill-bg:#dff5e8; --pill-line:#9bd7b4; --pill-ink:#15703f;
  --today-bg:#ffe8cf; --today-hi:#ffd4a3; --toast-bg:#101828; --toast-ink:#f3f5f9;
  --backdrop:rgba(16,24,40,.45);
  --good:#15703f; --bad:#a12a2a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
html.noscroll,html.noscroll body{overflow:hidden}
body{margin:0;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.app{max-width:560px;margin:0 auto;padding:0 12px 48px}
.top{display:flex;align-items:center;gap:8px;padding:10px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:19px;margin:0;flex:1;min-width:0;white-space:nowrap;letter-spacing:.01em}
.top h1 small{display:block;font-size:11px;font-weight:800;line-height:1.1;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
@media (max-width:399px){.pill.off{font-size:10px;padding:3px 7px}}

.top .tl{flex:1;min-width:0;display:flex;align-items:center}
.top .tr{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px}
@media (max-width:519px){.top .pill.off{display:inline-block;font-size:0;width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#3fb950}}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn.spin svg{animation:spin .8s linear infinite}
#splash{position:fixed;left:0;top:0;width:100%;height:100%;z-index:1000;background:#000;pointer-events:none;overflow:hidden}
#splash img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(.5);transform-origin:50% 50%;will-change:transform,opacity}
#splash.go img{animation:splashZoom 1.7s cubic-bezier(.22,.61,.36,1) forwards}

.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);display:grid;place-items:center;flex:none}

.next{display:block;width:100%;background:linear-gradient(135deg,var(--next-a),var(--next-b));border:2px solid var(--accent);border-radius:16px;padding:14px 16px;margin:2px 0 14px}
.next-k{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.next-t{font-size:18px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}

.mtitle{font:inherit;color:inherit;background:none;border:0;padding:8px 14px;border-radius:12px;cursor:pointer}

.mp-years{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.mp-y{min-width:64px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);color:var(--text);font-weight:700;font-size:15px}
.mp-y.none{opacity:.45}
.mp-y.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mp-months{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mp-m{height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);color:var(--muted);font-weight:700;font-size:16px}
.mp-m.has{color:var(--text);border-color:var(--line)}
.mp-m.cur{outline:2px solid var(--accent)}
.todaybtn{font-size:13px;font-weight:700;padding:0 12px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line2)}
.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.week{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0}
.grid{border-top-left-radius:0;border-top-right-radius:0;touch-action:pan-y pinch-zoom}
.week div{background:var(--head);font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:5px 0}
.cell{position:relative;min-height:68px;background:var(--surface);padding:4px 3px 4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.dim{background:var(--dim)}
.cell.dim .dn{opacity:.55}

.cell.today.today-flash{animation:todaypulse 1.05s ease-in-out 3}

  0%{background:var(--today-bg);box-shadow:inset 0 0 0 2.5px var(--now),0 0 0 0 var(--now-soft)}
  50%{background:var(--today-hi);box-shadow:inset 0 0 0 3.5px var(--now),0 0 0 9px var(--now-soft)}

}
@media (prefers-reduced-motion:reduce){.cell.today.today-flash{animation:none}}
.cell.nextd{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.sel,.cell.sel.nextd{box-shadow:inset 0 0 0 3px var(--text)}
.nextmark{position:absolute;top:3px;right:2px;font-size:7.5px;font-weight:900;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);padding:1px 3px;border-radius:4px}

.row.isnext{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row.isnext.sel{box-shadow:0 0 0 3px var(--text)}
.tag.nowtag{background:var(--accent);color:var(--accent-ink)}
.dn{font-size:12px;font-weight:700;color:var(--muted);align-self:flex-start;line-height:1.3}
.cell.today .dn{background:var(--now);color:var(--now-ink);border-radius:6px;padding:0 6px}
.bar{position:relative;height:16px;overflow:hidden}
.bar i{position:absolute;display:block;min-width:2px}
.bar .ext{background:var(--ext);top:3px;bottom:3px}
.bar .duty{background:var(--dutybar);top:1px;bottom:1px}

.bar .leg.flight{background:var(--flight)}
.bar .leg.deadhead,.bar .leg.ground{background:var(--dead)}
.bar .leg.event{background:var(--event)}
.lbl{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chip-day{background:var(--office-soft);color:var(--office-soft-ink);font-size:9px;font-weight:800;letter-spacing:.02em;border-radius:4px;padding:4px 0;text-align:center;margin-top:1px;overflow:hidden;text-overflow:clip;white-space:nowrap}
.chip-day.other{background:#5b6b8c;color:#fff}
.ci{display:flex;gap:2px;justify-content:flex-end;align-items:flex-end;margin-top:auto;min-height:21px;pointer-events:none}
.ic{display:inline-flex;width:21px;height:21px;flex:none}
.ic img{width:100%;height:100%;display:block}
.ic img.n{border-radius:22%;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
:root[data-theme="day"] .ic img.n,:root:not([data-theme="day"]) .ic img.d{display:none}
.ic-sim{width:23px;height:23px}
@media (max-width:599px){.chip-day.office{display:none}.cell{min-height:78px}.ci .ic:nth-child(3){display:none}.cell.oo .ci{position:absolute;left:0;right:0;top:22px;bottom:2px;margin:0;justify-content:center;align-items:center}.cell.oo .ic{width:40px;height:40px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:10px 2px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
.sect{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:16px 2px 8px;text-transform:uppercase}
.row{display:grid;grid-template-columns:6px 1fr 18px;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px;padding:0 10px 0 0}
.row.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row .stripe{align-self:stretch;background:var(--c)}
.row .rb{padding:10px 0}
.row .rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:16px}
.row .rs{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;margin-top:2px}
.row .rm{font-size:12px;color:var(--muted);margin-top:2px}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--tag-bg);color:var(--tag-ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-ink)}
.btn[disabled]{opacity:.5}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;animation:slide .16s ease-out;overscroll-behavior:contain}
@keyframes slide{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.panel{min-height:100%;background:var(--bg)}
.sheet-head{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
.sheet-title{flex:1;font-weight:800;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stat{background:var(--surface2);border-radius:10px;padding:8px 10px}

.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.range.fam .r-end{text-align:right}
.muted{color:var(--muted)}
.small{font-size:12px}
.notice{background:var(--notice-bg);border:1px solid var(--notice-line);color:var(--notice-ink);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:14px;margin:0 6px 6px 0}

.r-SI{background:#a83f62}.r-CP{background:#1f7a5c}.r-FO{background:#1d6fa8}.r-CA{background:#1d6fa8}.r-RP{background:#6b7a99}
.crewrow .sub{font-size:12px;color:var(--muted)}
.duty{scroll-margin-top:76px}
.dh{display:flex;align-items:baseline;gap:8px}

.dh span{font-size:13px;color:var(--muted)}
.tbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tb{background:var(--surface2);border-radius:10px;padding:8px 10px}
.tb-l{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.t-big{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}

.t-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

button.chip{min-height:40px;padding:0 14px}
.leg-card{display:grid;grid-template-columns:7px 1fr;border-radius:12px;overflow:hidden;background:var(--surface2);margin:10px 0 0}

.lm{padding:10px 12px}
.lt{display:flex;align-items:center;gap:8px}

.flt{font-weight:800;font-size:16px}
.blk{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}

      list.append(h('button', { type: 'button', class: 'pl-row', onclick: () => openPilot(e) },
        h('span', {}, h('span', { class: 'n', text: e.name }), h('span', { class: 's', text: `${fy === ly ? fy : fy + ' to ' + ly}${e.sims && !e.flights ? ' · simulator only' : ''}` })),
        h('span', { class: 'c', text: e.flights ? `${e.flights} flight${e.flights === 1 ? '' : 's'}` : `${e.sims} sim${e.sims === 1 ? '' : 's'}` })));
    }
    root.scrollTop = keep;
  }
  pl = { root, draw };
}

/* ---------- globe screen and tab bar ---------- */
let gl = null;
const fmtN = n => Math.round(n).toLocaleString('en-CA');
function glData() { return { legs: S.logbook.legs, ap: S.logbook.airports }; }
function glBuild() {
  const root = h('div', { id: 'globe', 'aria-label': 'Flight globe' });
  const cv = h('canvas');
  const stats = h('div', { class: 'gl-stats' });
  const panel = h('div', { class: 'gl-panel' });
  const info = h('div', { class: 'gl-info' });
  const empty = h('div', { class: 'gl-empty' }, h('div', {}, h('p', { style: 'font-size:18px;font-weight:700;margin:0 0 8px', text: 'No flight log loaded yet' }), h('p', { style: 'color:#8ea3c4;margin:0 0 14px', text: 'Sync your cjt-logbook file from the data repository, or import it by hand in Settings.' }), h('button', { type: 'button', class: 'gl-chip on', onclick: openSettings, text: 'Open Settings' })));
  const fbtn = h('button', { type: 'button', class: 'gl-ib gl-fbtn', 'aria-label': 'Filters', onclick: () => panel.classList.toggle('open') }, icon('sliders'));
  const gear = h('button', { type: 'button', class: 'gl-ib', 'aria-label': 'Settings', onclick: openSettings }, icon('gear'));
  const autoB = h('button', { type: 'button', class: 'gl-chip', id: 'gl-auto' }, 'Auto-rotate: on');
  const resetB = h('button', { type: 'button', class: 'gl-chip', id: 'gl-reset', text: 'Reset view' });
  const zi = h('button', { type: 'button', class: 'gl-zb', 'aria-label': 'Zoom in', text: '+' });
  const zo = h('button', { type: 'button', class: 'gl-zb', 'aria-label': 'Zoom out', text: '−' });
  root.append(cv, h('div', { class: 'gl-top' }, h('div', { class: 'gl-line' }, stats), panel), h('div', { class: 'gl-ctl' }, fbtn, gear, autoB, resetB, zi, zo), info, empty);
  document.body.append(root);
  const G = CJTGlobe(cv, window.CJT_LAND, glData(), { onSelect: c => showInfo(c) });
  const dstr = x => x.slice(0, 10);
  function showInfo(c) {
    if (!c || !S.logbook.airports[c]) { info.style.display = 'none'; return; }
    const a = S.logbook.airports[c], v = G.visits(c);
    info.replaceChildren(
      h('h3', {}, c + ' ', h('span', { text: [a[4], a[3]].filter(Boolean).join(', ') })),
      h('p', { text: a[0] }),
      h('p', { class: 'big', text: `${v.legs} flight${v.legs === 1 ? '' : 's'}, ${v.hrs.toFixed(1)} block hours` }),
      h('p', { text: v.first ? `First ${dstr(v.first)}, last ${dstr(v.last)}` : '' }));
    info.style.display = 'block';
  }
  function drawUI() {
    const st = G.stats();
    stats.replaceChildren(...[['Flights', fmtN(st.legs)], ['Airports', st.airports], ['Countries', st.countries], ['Hours', fmtN(st.hours)]].map(([k, v]) => h('div', { class: 'gl-stat' }, h('b', { text: String(v) }), h('span', { text: k }))));
    const ys = ['all', ...st.years];
    panel.replaceChildren(
      ...ys.map(y => h('button', { type: 'button', class: 'gl-chip' + (G.S.year === y ? ' on' : ''), onclick: () => { G.setYear(y); drawUI(); showInfo(G.S.sel); } }, y === 'all' ? 'All years' : y)),
      ...G.FLEET.map((f, i) => st.types[i] ? h('button', { type: 'button', class: 'gl-chip fl' + (G.S.fleet[i] ? '' : ' off'), onclick: () => { G.toggleFleet(i); drawUI(); showInfo(G.S.sel); } }, h('i', { style: 'background:' + f.c }), f.n || f.k) : []).flat());
    empty.style.display = S.logbook.legs.length ? 'none' : 'grid';
  }
  autoB.onclick = () => { G.S.auto = !G.S.auto; G.setAuto(G.S.auto); autoB.textContent = 'Auto-rotate: ' + (G.S.auto ? 'on' : 'off'); };
  resetB.onclick = () => G.resetView();
  zi.onclick = () => G.zoom(1.4); zo.onclick = () => G.zoom(1 / 1.4);
  gl = { root, G, ver: S.lbVer, drawUI, showInfo };
  drawUI();
}
function glRefresh() {
  if (!gl || gl.ver === S.lbVer) return;
  gl.ver = S.lbVer; gl.G.setData(glData()); gl.drawUI(); gl.showInfo(gl.G.S.sel);
}
function setTab(t) {
  if (t === 'pilots' && FAM()) t = 'schedule';
  if (t === 'globe' && !gl) glBuild();
  S.tab = t;
  document.querySelectorAll('#tabbar button').forEach(b => b.setAttribute('aria-current', b.dataset.t === t ? 'page' : 'false'));
  if (gl) {
    if (t === 'globe') { glRefresh(); gl.root.style.display = 'block'; gl.G.resume(); }
    else { gl.root.style.display = 'none'; gl.G.pause(); }
  }
  if (t === 'pilots') { if (!pl) plBuild(); pl.draw(); pl.root.style.display = 'block'; }
  else if (pl) pl.root.style.display = 'none';
  if (t === 'schedule') render();
}
function syncTabs() {
  const b = document.querySelector('#tabbar button[data-t="pilots"]');
  if (b) b.style.display = FAM() ? 'none' : '';
  if (FAM() && S.tab === 'pilots') { S.tab = 'schedule'; document.querySelectorAll('#tabbar button').forEach(x => x.setAttribute('aria-current', x.dataset.t === 'schedule' ? 'page' : 'false')); if (pl) pl.root.style.display = 'none'; }
  else if (pl && S.tab === 'pilots') pl.draw();
}
function buildTabBar() {
  const mk = (t, ic, label) => h('button', { type: 'button', 'data-t': t, 'aria-current': t === S.tab ? 'page' : 'false', onclick: () => setTab(t) }, icon(ic, 24), label);
  document.body.append(h('nav', { class: 'tabbar', id: 'tabbar', 'aria-label': 'Main' }, mk('schedule', 'calendar', 'Schedule'), mk('globe', 'globe', 'Globe'), mk('pilots', 'users', 'Pilots')));
}

/* ---------- boot ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; });
window.addEventListener('appinstalled', () => { S.installEvt = null; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!sheets.length) render(); autoSync(false); } });
/* Keyboard (desktop): arrows or PageUp/PageDown change month, T is today, 1 2 3 switch tabs, Esc closes the open panel. */
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
  const k = e.key;
  if (k === 'Escape') {
    if (sheets.length) { e.preventDefault(); closeSheet(); }
    else if (S.tab === 'schedule' && isWide() && (S.sel || S.selDay)) { e.preventDefault(); clearPane(); }
    return;
  }
  if (sheets.length) return;
  if (k === '1' || k === '2' || k === '3') {
    const tab = ['schedule', 'globe', 'pilots'][+k - 1];
    if (tab === 'pilots' && FAM()) return;
    e.preventDefault(); setTab(tab); return;
  }
  if (S.tab !== 'schedule') return;
  if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); shiftMonth(-1); }
  else if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); shiftMonth(1); }
  else if (k === 't' || k === 'T') { e.preventDefault(); const kk = keyOf(Date.now(), S.baseTz); S.month = { y: +kk.slice(0, 4), m: +kk.slice(5, 7) - 1 }; render(); }
});
setInterval(() => {
  document.querySelectorAll('.cd[data-st]').forEach(el => { const st = +el.dataset.st; if (st) el.textContent = countdown(st - Date.now()); });
}, 30000);

async function init() {
  try { const m = localStorage.getItem('cjt.mode'); if (['local', 'base', 'utc'].includes(m)) S.mode = m; } catch { /* ignore */ }
  try { const v = localStorage.getItem('cjt.view'); if (v === 'family') S.view = 'family'; } catch { /* ignore */ }
  try { const q = new URLSearchParams(location.search).get('view'); if (q === 'family' || q === 'full') setView(q); } catch { /* ignore */ }
  try { const t = localStorage.getItem('cjt.theme'); if (['auto', 'day', 'night'].includes(t)) S.theme = t; } catch { /* ignore */ }
  applyTheme();
  const onChange = f => (darkMQ.addEventListener ? darkMQ.addEventListener('change', f) : null);
  onChange(() => { if (S.theme === 'auto') applyTheme(); });
  if (wideMQ.addEventListener) wideMQ.addEventListener('change', () => {
    if (!wideMQ.matches) { runPaneClose(); S.sel = null; S.selDay = null; paneEl.replaceChildren(); }
    S.autoDone = false;
    render();
  });
  try { S.db = await openDB(); await loadAll(); } catch (e) { S.db = null; S.dbError = e; }
  const k = keyOf(Date.now(), S.baseTz);
  S.month = { y: +k.slice(0, 4), m: +k.slice(5, 7) - 1 };
  buildTabBar();
  render();
  try { const tq = new URLSearchParams(location.search).get('tab'); if (tq === 'globe' || tq === 'pilots') setTab(tq); } catch { /* ignore */ }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!sheets.length) render(); });
    navigator.serviceWorker.register('./sw.js').catch(() => { /* offline caching unavailable */ });
  }
  try { const m = sessionStorage.getItem('cjt.msg'); if (m) { sessionStorage.removeItem('cjt.msg'); toast(m); } } catch { /* ignore */ }
  requestPersist();
  autoSync(true);
}
init();
})();
</script>
